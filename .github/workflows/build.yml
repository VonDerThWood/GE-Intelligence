name: Build GEnius .exe

on:
  push:
    tags:
      - 'v*'          # triggers on: git tag v1.0.1 && git push --tags
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

# Without this, the default GITHUB_TOKEN only gets read access to repo
# contents, which is enough for softprops/action-gh-release to create the
# release and upload the .exe asset, but not enough for whatever follow-up
# call it makes to finalize it — surfaces as a "Resource not accessible by
# integration" failure on the job even though the release/asset actually
# went through successfully (confirmed for real, 2026-09-29: v2.7.0's
# release published fine with the exe attached despite this same job
# showing red). This just grants the token write access for this workflow.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build .exe
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: pkg
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GEnius v${{ steps.pkg.outputs.version }}"
          body: |
            ## GEnius v${{ steps.pkg.outputs.version }}

            ### Install
            1. Download `GEnius-Setup-${{ steps.pkg.outputs.version }}.exe` below
            2. Run the installer
            3. Make sure Python 3.10+ is installed: https://python.org
            4. Run `pip install requests beautifulsoup4` once in a terminal
            5. Launch GEnius from your desktop shortcut

            ### What's included
            - Full RS3 Grand Exchange market intelligence
            - Price tracking with RSI, Bollinger Bands, MA signals
            - Discord webhook alerts
            - News feed: RS3 official + Wiki + Reddit
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
