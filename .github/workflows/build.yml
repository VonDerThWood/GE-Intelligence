name: Build GEnius .exe

on:
  push:
    tags:
      - 'v*'          # triggers on: git tag v1.0.1 && git push --tags
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

# Without this, the default GITHUB_TOKEN only gets read access to repo
# contents, which is enough for softprops/action-gh-release to create the
# release and upload the .exe asset, but not enough for whatever follow-up
# call it makes to finalize it — surfaces as a "Resource not accessible by
# integration" failure on the job even though the release/asset actually
# went through successfully (confirmed for real, 2026-09-29: v2.7.0's
# release published fine with the exe attached despite this same job
# showing red). This just grants the token write access for this workflow.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Electron 44 requires Node >= 22.12
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build .exe
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: pkg
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GEnius v${{ steps.pkg.outputs.version }}"
          body: |
            ## GEnius v${{ steps.pkg.outputs.version }}

            ### Install
            1. Download `GEnius-Setup-${{ steps.pkg.outputs.version }}.exe` below
            2. Run the installer and launch GEnius from your desktop shortcut

            ### Safe to use
            - Open source: every line is in this repository, and this installer
              was built by GitHub Actions from that public code.
            - Never asks for your RuneScape login and never reads or connects to
              the game client. It only uses public price data (RuneScape Wiki /
              WeirdGloop).
            - No accounts, no servers: your data stays on your device.
            - Virus scan: see the VirusTotal link below (added automatically).
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uploads the installer to VirusTotal (~70 antivirus engines) and
      # appends the public scan link to the release notes, so cautious
      # players can check it without trusting us (Ben, 2026-10-20).
      # Needs the repository secret VT_API_KEY (free VirusTotal account ->
      # profile -> API key; GitHub repo -> Settings -> Secrets and variables
      # -> Actions -> New repository secret). Without it this step fails but
      # the release itself is already published.
      - name: VirusTotal scan
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_release_body: true
          files: |
            dist/*.exe
